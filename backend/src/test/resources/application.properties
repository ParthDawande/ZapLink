# ── Test overrides ──────────────────────────────────────────────────────────
# Uses H2 in-memory so @SpringBootTest never needs a real MySQL instance.
# Individual test classes can further override via @TestPropertySource.

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate generate the schema from entity definitions
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Silence the H2 "ENUM not supported" warning by telling Hibernate to use
# VARCHAR for @Enumerated(STRING) columns (which is what we want anyway)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# JWT defaults for tests (overridden per-class via @TestPropertySource)
jwt.secret=test-secret-for-springboottest-minimum-32-characters-padded
jwt.expiration-ms=3600000

# Skip schema.sql (MySQL syntax); Hibernate create-drop builds the schema from entities
spring.sql.init.mode=never

# Raise rate-limit buckets so tests never get throttled (buckets are shared
# within one app-context instance across the whole test suite).
ratelimit.register.capacity=1000
ratelimit.login.capacity=1000
ratelimit.create-link.capacity=1000
ratelimit.default.capacity=1000

# Other required properties
zaplink.base-url=http://localhost:8080
zaplink.frontend-url=http://localhost:5173

# Disable Safe Browsing in all @SpringBootTest tests — prevents external network calls.
safebrowsing.enabled=false
safebrowsing.api-key=test-key-unused
safebrowsing.timeout-ms=2000
