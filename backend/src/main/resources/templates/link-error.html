<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title} + ' — ZapLink'">Error — ZapLink</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-center p-5">
            <p class="fs-3 fw-bold mb-1">&#x26A1; ZapLink</p>
            <hr class="mb-4" />
            <h1 class="h4 text-danger mb-2" th:text="${title}">Error</h1>
            <p class="text-secondary mb-4" th:text="${message}">Something went wrong.</p>
            <a th:href="${frontendUrl}" class="btn btn-primary px-4">Go to ZapLink</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
